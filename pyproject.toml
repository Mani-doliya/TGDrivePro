[project]
name = "tgdrive-pro"
version = "1.0.0"
description = "Cross-platform Telegram cloud file manager desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2,<6",
    "Telethon>=1.36.0,<2",
    "Pillow>=10.0.0,<13",
]

[project.optional-dependencies]
drag-drop = ["tkinterdnd2>=0.4.2,<1]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py310"
